name: Cleanup Fantasy Bugg source

on:
  workflow_dispatch:
  push:
    paths:
      - "cleanup-source.trigger"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean malformed HTML source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')

          duplicate='''<title>Fantasy Bugg</title>\n<meta name="description" content="Fantasy Bugg – bygg ditt lag av svenska tävlingsdanspar, följ tävlingar, samla poäng och tävla mot vänner.\">\n\n<title>Fantasy Bugg</title>\n<meta name="description" content="Fantasy Bugg – bygg ditt lag av svenska tävlingsdanspar, följ tävlingar, samla poäng och tävla mot vänner.\">'''
          single='''<title>Fantasy Bugg</title>\n<meta name="description" content="Fantasy Bugg – bygg ditt lag av svenska tävlingsdanspar, följ tävlingar, samla poäng och tävla mot vänner.\">'''
          text=text.replace(duplicate,single,1)
          text=text.replace('<style>\n  \n<style>','<style>',1)
          text=text.replace('Extra byten kostar −35 p.','Extra byten kostar −100 p.')
          text=text.replace('Byte nummer 2 och framåt = −35 poäng.','Byte nummer 2 och framåt = −100 poäng.')
          text=text.replace('<div class="panel" style="margin-top:16px">\n<div class="panel" style="margin-top:16px">','<div class="panel" style="margin-top:16px">',1)
          text=text.replace('<link rel="stylesheet" href="premium.css">','<link rel="stylesheet" href="premium.css?v=2">',1)

          # fantasy_wallets gav 404 och behövs inte: bank = startbudget - aktuellt lagvärde.
          text=re.sub(
            r'\n  try\{\s*\n\s*await sb\s*\n\s*\.from\(\s*\n\s*"fantasy_wallets"\s*\n\s*\)[\s\S]*?\n  \}catch\(error\)\{\}\n',
            '\n',text,count=1
          )
          text=re.sub(
            r'\n    try\{\s*\n\s*const wallet\s*=\s*\n\s*await sb\s*\n\s*\.from\(\s*\n\s*"fantasy_wallets"\s*\n\s*\)[\s\S]*?\n    \}catch\(error\)\{\}\n',
            '\n',text,count=1
          )

          # En enskild publik dataladdning ska inte krascha hela appstarten.
          text=text.replace('''  await Promise.all([\n    loadCompetitions(),\n    loadStreams(),\n    loadHomeContent(),\n    loadPairHistory()\n  ]);''','''  const startupLoads = await Promise.allSettled([\n    loadCompetitions(),\n    loadStreams(),\n    loadHomeContent(),\n    loadPairHistory()\n  ]);\n\n  startupLoads.forEach(result => {\n    if(result.status === "rejected"){\n      console.warn("En startladdning misslyckades:", result.reason);\n    }\n  });''',1)

          text=text.replace('''  await handleSession(\n    data?.session ||\n    null\n  );''','''  try{\n    await handleSession(\n      data?.session ||\n      null\n    );\n  }catch(error){\n    console.error("Kunde inte läsa inloggad session:", error);\n  }''',1)

          text=text.replace('''start().catch(\n  error => {\n\n    console.error(\n      "Fantasy Bugg startfel:",\n      error\n    );\n\n    alert(\n      "Fantasy Bugg kunde inte starta. Öppna webbkonsolen för mer information."\n    );\n  }\n);''','''start().catch(\n  error => {\n    console.error(\n      "Fantasy Bugg startfel:",\n      error\n    );\n  }\n);''',1)

          # Alla separata launch-fixar laddas via stats.js.
          if 'src="stats.js' not in text:
            text=text.replace('</body>','<script src="stats.js?v=10"></script>\n</body>',1)

          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nothing to clean"
            exit 0
          fi
          git commit -m "Make Fantasy Bugg startup resilient"
          git push
