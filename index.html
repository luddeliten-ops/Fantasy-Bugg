<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="Marker.js"></script>

<script>
(function(){

  var fileInput = document.getElementById("csv");
  var readBtn = document.getElementById("readBtn");
  var saveBtn = document.getElementById("saveBtn");
  var status = document.getElementById("status");
  var saveStatus = document.getElementById("saveStatus");

  var market = window.FANTASY_MARKET || [];
  var lastRows = [];
  var lastParsed = null;

  var supabaseClient = window.supabase.createClient(
    "https://tkzjyasosqqshdzdvihr.supabase.co",
    "sb_publishable_Ew_yx90GcTw51DXFowAtug_lXwevjzm",
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );

  function escapeHtml(value){
    return String(value || "")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;");
  }

  function norm(s){
    return String(s || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"")
      .replace(/[^a-z0-9& ]/g," ")
      .replace(/\s+/g," ")
      .trim();
  }

  function parseCsvLine(line){

    var result = [];
    var current = "";
    var quote = false;

    for(var i=0;i<line.length;i++){

      var c = line[i];

      if(c === '"'){

        if(quote && line[i+1] === '"'){
          current += '"';
          i++;
        }else{
          quote = !quote;
        }

      }else if(c === ";" && !quote){

        result.push(current);
        current = "";

      }else{

        current += c;

      }

    }

    result.push(current);

    return result;
  }

  function readFile(file){

    return new Promise(function(resolve,reject){

      var reader = new FileReader();

      reader.onload = function(){
        resolve(reader.result);
      };

      reader.onerror = function(){
        reject(new Error("Kunde inte läsa CSV-filen."));
      };

      reader.readAsText(file,"UTF-8");

    });

  }

  function parseVote4Dance(text){

    text = text.replace(/^\uFEFF/,"");

    var lines = text.split(/\r?\n/);

    var competitionName = "";
    var competitionDate = "";

    for(var i=0;i<8 && i<lines.length;i++){

      var line = lines[i]
        .replace(/^#\s*/,"")
        .trim();

      if(!line || line === "RESULTS"){
        continue;
      }

      if(/^\d{4}-\d{2}-\d{2}$/.test(line)){
        competitionDate = line;
      }else if(!competitionName){
        competitionName = line;
      }

    }

    var headerIndex = -1;

    for(var j=0;j<lines.length;j++){

      if(lines[j].indexOf("Klassrubrik;") === 0){
        headerIndex = j;
        break;
      }

    }

    if(headerIndex === -1){
      throw new Error("Hittar inte Vote4Dance-resultat i filen.");
    }

    var header = parseCsvLine(lines[headerIndex]);

    function col(name){
      return header.indexOf(name);
    }

    var startCol = col("Startnr");
    var placeCol = col("Plac");
    var name1Col = col("Namn 1");
    var name2Col = col("Namn 2");
    var clubCol = col("Klubb");

    if(
      startCol === -1 ||
      placeCol === -1 ||
      name1Col === -1 ||
      name2Col === -1
    ){
      throw new Error("CSV-filen saknar nödvändiga kolumner.");
    }

    var currentClass = "";
    var rows = [];

    for(var k=headerIndex+1;k<lines.length;k++){

      var raw = lines[k].trim();

      if(!raw){
        continue;
      }

      if(raw.indexOf(";") === -1){

        currentClass = raw;
        continue;

      }

      var classMatch =
        currentClass.match(
          /^Bugg (Junior|Vuxen|Senior) ([NABCD])$/
        );

      if(!classMatch){
        continue;
      }

      var cells = parseCsvLine(lines[k]);

      var name1 = (cells[name1Col] || "").trim();
      var name2 = (cells[name2Col] || "").trim();

      if(!name1 || !name2){
        continue;
      }

      rows.push({
        age: classMatch[1],
        stage: classMatch[2],
        startNo: (cells[startCol] || "").trim(),
        place: parseInt(cells[placeCol],10) || 0,
        name: name1 + " & " + name2,
        club: clubCol >= 0
          ? (cells[clubCol] || "").trim()
          : ""
      });

    }

    return {
      name: competitionName || "Vote4Dance-tävling",
      date: competitionDate,
      rows: rows
    };

  }

  function highestStageRows(rows){

    var value = {
      N:1,
      D:2,
      C:3,
      B:4,
      A:5
    };

    var map = {};

    rows.forEach(function(row){

      var key =
        row.age +
        "|" +
        norm(row.name);

      if(
        !map[key] ||
        value[row.stage] > value[map[key].stage]
      ){
        map[key] = row;
      }

    });

    return Object.keys(map).map(function(key){
      return map[key];
    });

  }

  function basePoints(place){

    if(place === 1) return 100;
    if(place === 2) return 85;
    if(place === 3) return 75;
    if(place === 4) return 65;
    if(place === 5) return 60;
    if(place <= 10) return 50;
    if(place <= 20) return 35;
    if(place <= 40) return 20;

    return 10;
  }

  function getMultiplier(){

    var level =
      document.getElementById("level").value;

    return {
      ITT:1,
      Nationell:1.2,
      GP:1.5,
      DM:1.75,
      SM:2
    }[level] || 1;
  }

  function prepareRows(parsed){

    var rows =
      highestStageRows(parsed.rows);

    var multiplier =
      getMultiplier();

    rows.forEach(function(row){

      row.pairIndex =
        market.findIndex(function(p){

          return (
            p[0] === row.age &&
            norm(p[1]) === norm(row.name)
          );

        });

      row.matched =
        row.pairIndex >= 0;

      var entrants =
        rows.filter(function(r){
          return r.age === row.age;
        }).length;

      var raw =
        basePoints(row.place) +
        Math.max(0, entrants - row.place) +
        (row.place <= 10 ? 15 : 0) +
        (row.place <= 3 ? 10 : 0) +
        (row.place === 1 ? 15 : 0);

      row.points =
        Math.round(raw * multiplier);

    });

    return rows;
  }

  function render(parsed){

    var rows =
      prepareRows(parsed);

    lastParsed = parsed;
    lastRows = rows;

    var junior =
      rows.filter(function(r){
        return r.age === "Junior";
      });

    var adult =
      rows.filter(function(r){
        return r.age === "Vuxen";
      });

    var senior =
      rows.filter(function(r){
        return r.age === "Senior";
      });

    document.getElementById(
      "competitionName"
    ).textContent = parsed.name;

    document.getElementById(
      "competitionDate"
    ).textContent = parsed.date || "";

    document.getElementById(
      "juniorCount"
    ).textContent = junior.length;

    document.getElementById(
      "adultCount"
    ).textContent = adult.length;

    document.getElementById(
      "seniorCount"
    ).textContent = senior.length;

    document.getElementById(
      "summary"
    ).classList.remove("hidden");

    document.getElementById(
      "resultsCard"
    ).classList.remove("hidden");

    rows.sort(function(a,b){

      var order = {
        Junior:1,
        Vuxen:2,
        Senior:3
      };

      if(order[a.age] !== order[b.age]){
        return order[a.age] - order[b.age];
      }

      return a.place - b.place;

    });

    var html = "";

    rows.forEach(function(row){

      html +=
        '<div class="row">' +

          '<div class="name">' +
            escapeHtml(row.name) +
          '</div>' +

          '<div class="meta">' +

            'Bugg ' +
            escapeHtml(row.age) +

            ' · klass ' +
            escapeHtml(row.stage) +

            ' · startnr ' +
            escapeHtml(row.startNo) +

            ' · <span class="place">placering ' +
            escapeHtml(row.place) +
            '</span>' +

          '</div>' +

          '<div style="margin-top:6px;font-size:13px;font-weight:800;color:' +
            (row.matched ? '#16864d' : '#b13a46') +
          '">' +

            (row.matched
              ? '✓ Matchad mot fantasy-marknaden'
              : '⚠ Ej matchad') +

            ' · ' +
            row.points +
            ' fantasy-poäng' +

          '</div>' +

        '</div>';

    });

    document.getElementById(
      "results"
    ).innerHTML = html;

    status.textContent =
      "✅ " +
      rows.length +
      " unika Bugg-par lästa.";

    saveStatus.textContent = "";

  }

  readBtn.addEventListener(
    "click",
    async function(){

      try{

        var file =
          fileInput.files &&
          fileInput.files[0];

        if(!file){

          status.textContent =
            "Välj CSV-filen först.";

          return;
        }

        status.textContent =
          "Läser resultat…";

        var text =
          await readFile(file);

        var parsed =
          parseVote4Dance(text);

        render(parsed);

      }catch(error){

        console.error(error);

        status.textContent =
          "Fel: " +
          (error.message || error);

      }

    }
  );

  saveBtn.addEventListener(
    "click",
    async function(){

      try{

        saveBtn.disabled = true;
        saveStatus.textContent = "Sparar…";

        if(!lastParsed || !lastRows.length){
          throw new Error("Läs in CSV-filen först.");
        }

        var sessionResult =
          await supabaseClient.auth.getSession();

        var session =
          sessionResult.data.session;

        if(!session){
          throw new Error(
            "Du måste vara inloggad som admin."
          );
        }

        var level =
          document.getElementById("level").value;

        var competitionId =
          "csv-" + Date.now();

        var compInsert =
          await supabaseClient
            .from("competitions")
            .insert({
              id: competitionId,
              name: lastParsed.name,
              date: lastParsed.date || null,
              level: level,
              created_by: session.user.id
            });

        if(compInsert.error){
          throw compInsert.error;
        }

        var resultRows =
          lastRows
            .filter(function(row){

              return (
                row.matched &&
                row.pairIndex >= 0
              );

            })
            .map(function(row){

              return {
                competition_id: competitionId,
                pair_index: row.pairIndex,
                pair_name: row.name,
                placement: row.place,
                matched: true,
                fantasy_points: row.points
              };

            });

        if(!resultRows.length){
          throw new Error(
            "Inga matchade resultat att spara."
          );
        }

        var resultsInsert =
          await supabaseClient
            .from("competition_results")
            .insert(resultRows);

        if(resultsInsert.error){
          throw resultsInsert.error;
        }

        saveStatus.textContent =
          "✅ Sparat! " +
          resultRows.length +
          " resultat.";

      }catch(error){

        console.error(error);

        saveStatus.textContent =
          "Fel: " +
          (error.message || error);

      }finally{

        saveBtn.disabled = false;

      }

    }
  );

})();
</script>

</body>
</html>
