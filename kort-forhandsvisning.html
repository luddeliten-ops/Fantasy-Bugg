<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fantasy Bugg – kortförhandsvisning</title><style>
*{box-sizing:border-box}body{margin:0;background:#071b3b;color:white;font:16px Arial,sans-serif}main{max-width:1080px;margin:auto;padding:24px 12px}p{color:#c9d8f2}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}.card{border-radius:14px;overflow:hidden;background:#fff;color:#071b3b}.card-title{padding:9px 8px;min-height:52px;font-size:13px;font-weight:800;text-align:center;display:flex;align-items:center;justify-content:center}.art{position:relative;height:210px;background:#17385e;overflow:hidden}.art img{display:block;width:100%;height:100%;object-fit:cover;object-position:center top}.price{position:absolute;z-index:2;bottom:7px;left:50%;transform:translateX(-50%);background:#f5c542;padding:6px 12px;border-radius:8px;font-weight:bold;white-space:nowrap;box-shadow:0 2px 8px #0008}.buttons{display:flex;gap:6px;padding:8px}.buttons button{flex:1;border:0;border-radius:7px;padding:8px 2px;font-weight:bold;background:#edf3fb;color:#071b3b}.buttons button:last-child{background:#f5c542}#status{padding:12px;background:#15365b;border-radius:9px;margin:16px 0}@media(max-width:500px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.art{height:195px}.card-title{font-size:12px}}
</style></head><body><main><h1>Dansparkort – förhandsvisning</h1><p>Namn ovanför fotot och priset längst ned i mitten. Detta är en separat förhandsvisning; ditt lag ändras inte.</p><div id="status" role="status">Laddar godkända bildkopplingar…</div><div class="grid" id="cards"></div></main><script src="Marker.js"></script><script>
const totals={Vuxen:127,Senior:117,Junior:24},ranks={};
const market=(window.FANTASY_MARKET||[]).map((r,index)=>{let cls=Array.isArray(r)?r[0]:r.cls||r.class||r.category;cls=String(cls).replace(/^Bugg\s+/i,'').trim();let name=Array.isArray(r)?r[1]:r.name||r.pair_name||r.pairName;let rank=ranks[cls]=(ranks[cls]||0)+1,p=rank/(totals[cls]||127);return {index,cls,name,price:Number(r.price)||(p<=.08?30:p<=.16?24:p<=.28?19:p<=.42?15:p<=.58?12:p<=.78?9:6)}});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const status=document.getElementById('status');
async function loadMappings(){
 const url='https://api.github.com/repos/luddeliten-ops/Fantasy-Bugg/contents/data/peppelinos-image-mappings.review.json?ref=review%2Fpeppelinos-image-mappings';
 const response=await fetch(url,{headers:{Accept:'application/vnd.github+json'},cache:'no-store'});
 if(!response.ok)throw Error('GitHub svarade '+response.status+' när bildkopplingarna hämtades');
 const file=await response.json();
 if(!file.content)throw Error('GitHub skickade ingen bilddata');
 const binary=atob(file.content.replace(/\s/g,''));
 const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
 return JSON.parse(new TextDecoder().decode(bytes));
}
loadMappings().then(data=>{
 const matches=(data.mappings||[]).filter(m=>m.primaryImageUrl&&market[m.repositoryIndex]?.name===m.repositoryName);
 status.textContent=matches.length+' godkända bildkopplingar hittades. Knapparna är bara förhandsvisning.';
 document.getElementById('cards').innerHTML=matches.map(m=>{const p=market[m.repositoryIndex];return `<article class="card"><div class="card-title">${esc(p.name)}</div><div class="art"><img src="${esc(m.primaryImageUrl)}" alt="${esc(p.name)}" loading="lazy" onerror="this.style.display='none';this.parentElement.style.background='#17385e';this.parentElement.insertAdjacentHTML('afterbegin','<span style=&quot;display:block;padding:18px;color:white;text-align:center&quot;>Foto kunde inte laddas</span>')"><span class="price">${p.price} M</span></div><div class="buttons"><button type="button">Info</button><button type="button">Välj</button></div></article>`}).join('');
 if(!matches.length)status.textContent='Bildfilen laddades men inga namn matchade. Kontrollera Marker.js och kopplingarnas ID.';
}).catch(e=>{status.textContent='Kunde inte ladda korten: '+e.message;console.error(e)});
</script></body></html>
