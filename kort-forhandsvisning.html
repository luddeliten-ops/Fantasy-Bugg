<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fantasy Bugg – kortförhandsvisning</title><style>
*{box-sizing:border-box}body{margin:0;background:#071b3b;color:#fff;font:16px Arial,sans-serif}main{max-width:1080px;margin:auto;padding:24px 12px}p{color:#c9d8f2}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}.card{border-radius:14px;overflow:hidden;background:#fff;color:#071b3b}.art{position:relative;height:235px;background:#17385e;overflow:hidden}.art img{display:block;width:100%;height:100%;object-fit:cover;object-position:center top}.art:after{content:'';position:absolute;bottom:0;left:0;width:58%;height:43px;background:linear-gradient(90deg,#071b3b 65%,transparent);pointer-events:none}.price{position:absolute;z-index:2;bottom:7px;left:50%;transform:translateX(-50%);background:#f5c542;padding:6px 12px;border-radius:8px;font-weight:bold;white-space:nowrap;box-shadow:0 2px 8px #0008}.buttons{display:flex;gap:6px;padding:8px}.buttons button{flex:1;border:0;border-radius:7px;padding:8px 2px;font-weight:bold;background:#edf3fb;color:#071b3b}.buttons button:last-child{background:#f5c542}#status{padding:12px;background:#15365b;border-radius:9px;margin:16px 0}.photo-error{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:white;padding:12px;font-size:12px}.photo-error a{color:#f5c542}@media(max-width:500px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.art{height:205px}}
</style></head><body><main><h1>Dansparkort – förhandsvisning</h1><p>Enbart foto och pris. Pris längst ned i mitten. Ingen ändring görs i ditt lag.</p><div id="status" role="status">Hämtar bildkopplingar…</div><div class="grid" id="cards"></div></main><script src="Marker.js"></script><script>
const totals={Vuxen:127,Senior:117,Junior:24},ranks={};
const market=(window.FANTASY_MARKET||[]).map((r,index)=>{let cls=Array.isArray(r)?r[0]:r.cls||r.class||r.category;cls=String(cls).replace(/^Bugg\s+/i,'').trim();let name=Array.isArray(r)?r[1]:r.name||r.pair_name||r.pairName;let rank=ranks[cls]=(ranks[cls]||0)+1,p=rank/(totals[cls]||127);return {index,cls,name,price:Number(r.price)||(p<=.08?30:p<=.16?24:p<=.28?19:p<=.42?15:p<=.58?12:p<=.78?9:6)}});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const status=document.getElementById('status'),grid=document.getElementById('cards');
async function loadMappings(){
 const urls=['https://raw.githubusercontent.com/luddeliten-ops/Fantasy-Bugg/review/peppelinos-image-mappings/data/peppelinos-image-mappings.review.json','https://api.github.com/repos/luddeliten-ops/Fantasy-Bugg/contents/data/peppelinos-image-mappings.review.json?ref=review%2Fpeppelinos-image-mappings'];
 let errors=[];
 for(const url of urls){try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();if(Array.isArray(data.mappings))return data;if(data.content){const bytes=Uint8Array.from(atob(data.content.replace(/\s/g,'')),c=>c.charCodeAt(0));const parsed=JSON.parse(new TextDecoder().decode(bytes));if(Array.isArray(parsed.mappings))return parsed;}throw Error('Felaktigt JSON-format');}catch(e){errors.push(e.message)}}throw Error(errors.join(' / '));
}
loadMappings().then(data=>{
 const matches=(data.mappings||[]).filter(m=>m.primaryImageUrl&&market[m.repositoryIndex]?.name===m.repositoryName);
 status.textContent=matches.length+' bildkopplingar hittade. Kontrollerar foton…';
 grid.innerHTML=matches.map(m=>{const p=market[m.repositoryIndex];return `<article class="card"><div class="art"><img src="${esc(m.primaryImageUrl)}" alt="Danspar" loading="lazy" referrerpolicy="no-referrer" data-photo><span class="price">${p.price} M</span></div><div class="buttons"><button type="button" title="Förhandsvisning">Info</button><button type="button" title="Förhandsvisning">Välj</button></div></article>`}).join('');
 let loaded=0,failed=0;const imgs=[...grid.querySelectorAll('[data-photo]')];if(!imgs.length){status.textContent='Inga bildkopplingar matchade Marker.js.';return;}
 imgs.forEach(img=>{const report=ok=>{if(ok)loaded++;else{failed++;img.style.display='none';const d=document.createElement('div');d.className='photo-error';const a=document.createElement('a');a.href=img.src;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Öppna bild direkt';d.append('Foto kunde inte laddas. ',a);img.parentElement.append(d);}status.textContent=`Bildkopplingar: ${matches.length}. Foton laddade: ${loaded}. Fel: ${failed}.`;};img.addEventListener('load',()=>report(true),{once:true});img.addEventListener('error',()=>report(false),{once:true});if(img.complete)report(img.naturalWidth>0);});
}).catch(e=>{status.textContent='Kunde inte hämta bildkopplingarna: '+e.message;console.error(e)});
</script></body></html>
