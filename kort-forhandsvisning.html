<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fantasy Bugg – förhandsvisning</title><style>*{box-sizing:border-box}body{margin:0;background:#071b3b;color:#fff;font:16px Arial,sans-serif}main{max-width:1050px;margin:auto;padding:24px 12px}p{color:#c9d8f2}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}.card{border-radius:14px;overflow:hidden;background:white;color:#071b3b}.art{position:relative;height:230px;background:#17385e}.art img{width:100%;height:100%;object-fit:cover;object-position:center top}.art:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 30%,#071b3b)}.price{position:absolute;z-index:2;right:7px;top:7px;background:#f5c542;padding:6px;border-radius:7px;font-weight:bold}.name{position:absolute;z-index:2;bottom:10px;left:9px;right:9px;font-size:13px;font-weight:bold;color:white;text-shadow:0 1px 3px black}.name small{display:block;margin-top:4px;font-weight:normal}.buttons{display:flex;gap:6px;padding:8px}.buttons button{flex:1;border:0;border-radius:7px;padding:8px 2px;font-weight:bold;background:#edf3fb}.buttons button:last-child{background:#f5c542}#status{padding:12px;background:#15365b;border-radius:9px;margin:16px 0}@media(max-width:500px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.art{height:205px}}</style></head><body><main><h1>Dansparkort – förhandsvisning</h1><p>Riktiga bilder och priser från Fantasy Bugg. Den här sidan är separat; inga lag ändras.</p><div id="status">Laddar bilder…</div><div class="grid" id="cards"></div></main><script src="Marker.js"></script><script>const totals={Vuxen:127,Senior:117,Junior:24},ranks={};const market=(window.FANTASY_MARKET||[]).map((r,index)=>{let cls=Array.isArray(r)?r[0]:r.cls||r.class||r.category;cls=String(cls).replace(/^Bugg\s+/i,'').trim();let name=Array.isArray(r)?r[1]:r.name||r.pair_name||r.pairName;let rank=ranks[cls]=(ranks[cls]||0)+1,p=rank/(totals[cls]||127);return {index,cls,name,price:Number(r.price)||(p<=.08?30:p<=.16?24:p<=.28?19:p<=.42?15:p<=.58?12:p<=.78?9:6)}});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('https://raw.githubusercontent.com/luddeliten-ops/Fantasy-Bugg/review/peppelinos-image-mappings/data/peppelinos-image-mappings.review.json').then(r=>{if(!r.ok)throw Error('Bildfilen kunde inte hämtas');return r.json()}).then(data=>{let matches=(data.mappings||[]).filter(m=>m.primaryImageUrl&&market[m.repositoryIndex]?.name===m.repositoryName);document.getElementById('status').textContent=matches.length+' godkända bildkopplingar visas. Knapparna är endast förhandsvisning.';document.getElementById('cards').innerHTML=matches.map(m=>{let p=market[m.repositoryIndex];return `<article class="card"><div class="art"><img src="${esc(m.primaryImageUrl)}" alt="${esc(p.name)}" loading="lazy"><span class="price">${p.price} M</span><div class="name">${esc(p.name)}<small>Bugg ${esc(p.cls)}</small></div></div><div class="buttons"><button type="button">Info</button><button type="button">Välj</button></div></article>`}).join('')}).catch(e=>document.getElementById('status').textContent='Fel: '+e.message)</script></body></html>
