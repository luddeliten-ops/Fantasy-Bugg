<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Förhandsvisning – Fantasy Bugg-kort</title><style>*{box-sizing:border-box}body{margin:0;background:#071b3b;color:white;font-family:Inter,Arial,sans-serif}main{max-width:1080px;margin:auto;padding:26px 15px}h1{margin-bottom:8px}p{color:#c8d8f1}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-top:26px}.card{background:#fff;border-radius:15px;overflow:hidden;color:#071b3b;box-shadow:0 10px 30px #0005}.art{height:235px;position:relative;background:#17385e;overflow:hidden}.art img{display:block;width:100%;height:100%;object-fit:cover;object-position:center top}.art:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 35%,#071b3b 100%);pointer-events:none}.price{position:absolute;top:8px;right:8px;background:#f5c542;border-radius:8px;padding:6px 9px;font-weight:900;z-index:1}.info{position:absolute;bottom:10px;left:10px;right:10px;color:white;z-index:1;text-shadow:0 1px 3px #000}.info b{font-size:14px;line-height:1.25;display:block}.info small{display:block;color:#dce8ff;margin-top:5px}.actions{display:flex;gap:7px;padding:9px}.actions button{flex:1;border:0;border-radius:8px;padding:9px 4px;font-weight:800;background:#edf3fb;color:#071b3b}.actions button:last-child{background:#f5c542}.notice{background:#14365c;border:1px solid #45658c;border-radius:12px;padding:12px;margin-top:18px}@media(max-width:440px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.art{height:205px}.info b{font-size:12px}}</style></head><body><main><h1>Dansparkort – förhandsvisning</h1><p>Riktiga foton, namn och priser från Fantasy Bugg. Detta är en separat visningssida och ändrar inte ditt lag.</p><div class="notice" id="status">Laddar godkända bildkopplingar…</div><div class="grid" id="cards"></div></main><script src="Marker.js"></script><script>const totals={Vuxen:127,Senior:117,Junior:24},ranks={};function price(rank,cls){const p=rank/(totals[cls]||127);return p<=.08?30:p<=.16?24:p<=.28?19:p<=.42?15:p<=.58?12:p<=.78?9:6}const market=(window.FANTASY_MARKET||[]).map((row,index)=>{const cls=Array.isArray(row)?row[0]:row.cls||row.class||row.category;const name=Array.isArray(row)?row[1]:row.name||row.pair_name||row.pairName;const rank=ranks[cls]=(ranks[cls]||0)+1;return {index,cls,name,price:Number(row.price)||price(rank,cls)}});const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('./data/peppelinos-image-mappings.review.json').then(r=>{if(!r.ok)throw Error('Kunde inte hämta bildkopplingarna');return r.json()}).then(data=>{const matches=(data.mappings||[]).filter(m=>m.primaryImageUrl&&market[m.repositoryIndex]?.name===m.repositoryName);document.getElementById('status').textContent=`${matches.length} bildkopplingar hittades. Förhandsvisning – knapparna påverkar inte ditt riktiga lag.`;document.getElementById('cards').innerHTML=matches.map(m=>{const p=market[m.repositoryIndex];return `<article class="card"><div class="art"><img loading="lazy" src="${escapeHTML(m.primaryImageUrl)}" alt="Foto: ${escapeHTML(p.name)}"><span class="price">${p.price} M</span><div class="info"><b>${escapeHTML(p.name)}</b><small>Bugg ${escapeHTML(p.cls)}</small></div></div><div class="actions"><button type="button" onclick="alert('Förhandsvisning: ${escapeHTML(p.name).replace(/'/g,'')}')">Info</button><button type="button" onclick="alert('Förhandsvisning – inga lagändringar sparas')">Välj</button></div></article>`}).join('')}).catch(e=>{document.getElementById('status').textContent='Kunde inte ladda korten: '+e.message})</script></body></html>
